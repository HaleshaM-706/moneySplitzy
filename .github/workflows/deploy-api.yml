
name: Build and Upload MoneySplitzy API

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @money-split/api prisma:generate

      - name: Build API
        run: pnpm --filter @money-split/api build
      
      - name: Create API env
        run: |
          cat > apps/api/.env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          API_PUBLIC_URL=${{ secrets.API_PUBLIC_URL }}
          EOF

      - name: Package API
        run: |
          mkdir -p release
          cp -r apps/api/dist release/
          cp -r apps/api/prisma release/
          cp package.json release/
          cp pnpm-lock.yaml release/
          tar -czf money-splitzy-api.tar.gz -C release .

      - name: Upload to S3
        run: |
          aws s3 cp money-splitzy-api.tar.gz \
            s3://moneysplitzy-api-deploy/api/money-splitzy-api.tar.gz
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Verify S3 upload
          run: |
            aws s3 ls s3://moneysplitzy-api-deploy/api/ \
              --region ap-south-1
